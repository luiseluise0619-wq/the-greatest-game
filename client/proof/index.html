<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>High Noon Hollow — proof sheet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%A4%A0</text></svg>" />
<!--
  The press proof. Open /proof/ while the server is running to see every card
  face at full size; this is how the deck in client/js/cardart.js was tuned, and
  it is the fastest way to check a change to it. /proof/?c=witness prints one.

  /proof/?deck=duel is the other deck - the eighty of the turn mode, out of
  client/js/duelart.js, on the same press.
-->
<style>
  body { margin: 0; background: #17120e; color: #b8a586; font: 12px "Courier New", monospace; padding: 16px; }
  h1 { font-size: 13px; letter-spacing: .3em; font-weight: normal; margin: 0 0 14px; }
  #sheet { display: flex; flex-wrap: wrap; gap: 16px; }
  canvas { width: 300px; height: 420px; box-shadow: 0 10px 26px rgba(0,0,0,.7); }
  body.one canvas { width: 600px; height: 840px; }
</style>
</head>
<body>
<h1 id="head">THE DECK — PROOF SHEET</h1>
<div id="sheet"></div>
<script type="module">
  import { CARDS, CARD_ORDER } from '../../shared/constants.js';
  import { DUEL_CARDS, DUEL_CARD_ORDER } from '../../shared/deck.js';
  import { useDefs, cardCanvas, plate } from '../js/cardart.js';
  import { CUT, PIP, FIT } from '../js/duelart.js';
  useDefs(CARDS);
  const q = new URLSearchParams(location.search);
  const only = q.get('c');
  const duel = q.get('deck') === 'duel';
  if (only) document.body.classList.add('one');
  const sheet = document.getElementById('sheet');
  if (duel) {
    document.getElementById('head').textContent = 'THE EIGHTY — PROOF SHEET';
    for (const id of (only ? [only] : DUEL_CARD_ORDER)) {
      const d = DUEL_CARDS[id];
      sheet.appendChild(plate({
        id: `duel:${id}`, name: d.name, rules: d.rules, flavour: d.flavour,
        cut: CUT[id], pip: PIP[id], fit: FIT[id],
      }));
    }
  } else {
    for (const id of (only ? [only] : [...CARD_ORDER, 'back'])) sheet.appendChild(cardCanvas(id));
  }
  window.__ready = true;
</script>
</body>
</html>
